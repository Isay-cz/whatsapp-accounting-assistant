services:
  api:
    build: ./api
    restart: unless-stopped
    volumes:
      - ./api:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      META_APP_SECRET: ${META_APP_SECRET}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID}
      META_API_VERSION: ${META_API_VERSION:-v21.0}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      TICKET_SYSTEM_BASE_URL: ${TICKET_SYSTEM_BASE_URL}
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - cgho_net

# Postgres y Redis NO se definen aquí — corren en el stack de cgho-ops (CGHO
# Sistema de Tickets) y se comparten a nivel de proceso, no de datos: este bot
# usa una base de datos y un rol de Postgres separados, y namespaced sus llaves
# de Redis con el prefijo `bot:`. Ver CLAUDE.md, decisión #3.
#
# `cgho_net` debe existir como red externa antes de `docker compose up` —
# hoy en día el docker-compose.yml de cgho-ops declara su red `cgho_net` como
# `driver: bridge` sin `external: true`, así que unirse desde este repo va a
# fallar hasta que ese archivo (en el otro repo) se actualice para exponerla.
# Ver CLAUDE.md, sección Pendientes.
networks:
  cgho_net:
    external: true
