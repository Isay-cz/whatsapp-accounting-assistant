services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    volumes:
      - ./api:/app
      # El mount de arriba reemplaza /app completo con el host ./api, así que
      # alembic.ini y db/migrations (fuera de ./api, ver api/Dockerfile) se
      # montan aparte para no perderlos.
      - ./alembic.ini:/app/alembic.ini
      - ./db:/app/db
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      META_APP_SECRET: ${META_APP_SECRET}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID}
      META_API_VERSION: ${META_API_VERSION:-v21.0}
      # Solo se sobrescribe en entornos de prueba, para mandar la salida a
      # scripts/meta_sink.py en vez de a Meta (ver scripts/README.md).
      META_GRAPH_BASE_URL: ${META_GRAPH_BASE_URL:-https://graph.facebook.com}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      TICKET_SYSTEM_BASE_URL: ${TICKET_SYSTEM_BASE_URL:-http://tickets-api:8000}
      WORKER_SYNC_INTERVAL_SECONDS: ${WORKER_SYNC_INTERVAL_SECONDS:-300}
      DEBUG: ${DEBUG:-false}
    # Sin `ports`: el webhook se expone por Cloudflare Tunnel, no publicando un
    # puerto al host (CLAUDE.md, decisión #17). Publicarlo además chocaba con
    # lo que ya escucha en 8000 en el servidor.
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      cgho_net:
        # Espejo del alias `tickets-api` del otro stack, y por la misma razón:
        # los dos composes nombran `api` a su servicio, así que en `cgho_net`
        # el nombre `api` resuelve a los dos contenedores indistintamente.
        # Cualquier cosa que necesite hablarle a ESTE servicio desde la red
        # compartida (el reverse proxy, el sink de pruebas) usa `bot-api`.
        aliases:
          - bot-api

# Postgres y Redis NO se definen aquí — corren en el stack de cgho-ops (CGHO
# Sistema de Tickets) y se comparten a nivel de proceso, no de datos: este bot
# usa una base de datos y un rol de Postgres separados, y namespaced sus llaves
# de Redis con el prefijo `bot:`. Ver CLAUDE.md, decisión #3.
#
# `cgho_net` la crea el stack de cgho-ops, que fija su nombre con `name:` en su
# propio docker-compose.yml. Por eso aquí es `external: true`: este stack se
# une a una red que no administra. Consecuencia operativa: cgho-ops se levanta
# primero. Si no está arriba, `docker compose up` de este repo falla con
# "network cgho_net not found", que es el error correcto.
networks:
  cgho_net:
    external: true
