[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
testpaths = tests
# Las pruebas `live` salen a la red real (DeepSeek, sistema de tickets) y
# escriben en la base real — quedan fuera de la corrida normal. Se piden
# explícitamente con `pytest -m live` (ver README, sección Pruebas).
addopts = -m "not live"
markers =
    live: pega a servicios reales y escribe datos reales; requiere el stack de docker-compose.yml
